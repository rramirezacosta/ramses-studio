name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'build/icons/**'
      - 'build/screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -v -p site/assets
          cp -v pages/index.html site/
          cp -v build/icons/app_512.png site/assets/
          cp -v build/screenshots/screenshot.png site/assets/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
